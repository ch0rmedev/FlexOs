name: Build FlexOS image

on:
  workflow_dispatch:        # lets you press a "Run workflow" button on GitHub

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring parted dosfstools \
            e2fsprogs gdisk util-linux xz-utils

      - name: Build image
        run: |
          chmod +x build-image.sh
          sed -i 's/\r$//' build-image.sh
          df -h /
          # bookworm is used because the Ubuntu runner's debootstrap supports it reliably
          sudo SUITE=bookworm SIZE=8G ./build-image.sh

      - name: Compress image
        run: |
          sudo xz -T0 -6 flexos.img
          ls -lh flexos.img.xz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: flexos-image
          path: flexos.img.xz
          compression-level: 0
          retention-days: 7
